{# Shared auth links snippet. Include inside a .b-nav-links list.
   Keeps the bento nav theme in every template. #}
{% if current_user.is_authenticated %}
    <li><a href="{{ url_for('dashboard') }}">Dashboard</a></li>
    <li><span class="b-nav-user" title="{{ current_user.email }}">{{ current_user.name }}</span></li>
    <li><form method="POST" action="{{ url_for('logout') }}" style="display:inline; margin:0;"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button type="submit" class="b-btn b-btn--ghost b-btn--sm" style="font-family:inherit;">Logout</button></form></li>
{% else %}
    <li><a href="{{ url_for('login') }}">Login</a></li>
    <li><a href="{{ url_for('register') }}" class="b-btn b-btn--primary b-btn--sm">Sign Up</a></li>
{% endif %}
